[versions]
agp                 = "8.5.2"
kotlin              = "2.0.21"
coreKtx             = "1.13.1"
lifecycle           = "2.8.6"
activityCompose     = "1.9.2"
composeBom          = "2024.10.00"
cameraX             = "1.3.4"
mlkitFace           = "16.1.7"
permissionsCompose  = "0.36.0"
datastorePrefs      = "1.1.1"
coroutines          = "1.9.0"
biometric           = "1.1.0"

[libraries]
# AndroidX Core
androidx-core-ktx            = { group = "androidx.core",       name = "core-ktx",                  version.ref = "coreKtx" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose    = { group = "androidx.activity",   name = "activity-compose",            version.ref = "activityCompose" }

# Compose BOM
compose-bom                  = { group = "androidx.compose",    name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-animation            = { group = "androidx.compose.animation", name = "animation" }

# CameraX
camerax-core                 = { group = "androidx.camera",     name = "camera-core",                version.ref = "cameraX" }
camerax-camera2              = { group = "androidx.camera",     name = "camera-camera2",             version.ref = "cameraX" }
camerax-lifecycle            = { group = "androidx.camera",     name = "camera-lifecycle",           version.ref = "cameraX" }

# ML Kit Face Detection (unbundled — no Google Play Services required)
mlkit-face-detection         = { group = "com.google.mlkit",   name = "face-detection",             version.ref = "mlkitFace" }

# Permissions (Compose)
accompanist-permissions      = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissionsCompose" }

# DataStore
datastore-preferences        = { group = "androidx.datastore", name = "datastore-preferences",       version.ref = "datastorePrefs" }

# Coroutines
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Biometric
biometric                    = { group = "androidx.biometric", name = "biometric",                   version.ref = "biometric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
